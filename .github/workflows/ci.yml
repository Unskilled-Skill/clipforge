name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Windows: the backend calls Win32 APIs directly (windows crate).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` = tsc + vite build; also produces the dist/ the
      # Tauri crate embeds, so clippy below compiles like a real build.
      - name: Type-check and build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked
